{% extends "admin/change_list.html" %}
{% block content %}
    {% if can_quick_add %}
        <div class="mb-4 rounded border border-base-200 bg-white p-4 shadow-sm dark:border-base-800 dark:bg-base-900">
            <form method="post" class="grid grid-cols-12 items-end gap-4">
                {% csrf_token %}
                <input type="hidden" name="_quick_add_short_task" value="1">
                <div class="col-span-12 sm:col-span-9 lg:col-span-10">
                    <input id="quick-task-title"
                           type="text"
                           name="title"
                           maxlength="255"
                           placeholder="Enter the task title here"
                           required
                           class="w-full rounded border border-base-200 bg-white px-3 py-2 text-sm dark:border-base-700 dark:bg-base-900">
                </div>
                <div class="col-span-12 sm:col-span-3 lg:col-span-2">
                    <button type="submit"
                            class="h-10 w-full rounded bg-primary-600 px-4 text-sm font-medium text-white hover:bg-primary-700">
                        Add task
                    </button>
                </div>
            </form>
        </div>
    {% endif %}
    {{ block.super }}
{% endblock content %}
