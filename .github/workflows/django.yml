name: Django CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Copy .env file
        run: cp .env.example .env

      - name: Run tests
        run: python manage.py test

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: django-production
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy.pem
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy.pem ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy.pem \
            -o StrictHostKeyChecking=yes \
            "ubuntu@${DEPLOY_HOST}" \
            "DEPLOY_SHA=${GITHUB_SHA} bash -se" <<'REMOTE'
          set -e
          cd /home/ubuntu/deepsea_tasks

          git fetch origin main
          git merge --ff-only "$DEPLOY_SHA"

          venv/bin/python -m pip install -r requirements.txt
          venv/bin/python manage.py migrate --noinput
          venv/bin/python manage.py collectstatic --noinput

          sudo -n systemctl restart gunicorn.service
          REMOTE
